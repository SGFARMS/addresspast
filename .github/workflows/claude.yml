# Claude change-request workflow for Sky High site repos.
#
# Copy this file to `.github/workflows/claude.yml` in each site repo (roadrunner-compliance-site,
# grantsprout, tally-site, hemp-connect, sky-high-web, ...). The skyhighwebsites.dev owner
# console's "Request a change" box opens a GitHub issue that mentions @claude; this workflow
# picks it up, makes the change on a new `claude/...` branch and opens a pull request. It never
# pushes to the default branch — you review and merge the PR (which is what redeploys the site).
#
# One-time setup per repo:
#   1. Install the Claude GitHub app on the repo: https://github.com/apps/claude
#      (or run `/install-github-app` in Claude Code).
#   2. Run `claude setup-token` locally (needs a Claude Pro/Max subscription) and add the token
#      it prints as a repository secret named CLAUDE_CODE_OAUTH_TOKEN
#      (Settings -> Secrets and variables -> Actions -> New repository secret).
#   3. Commit this file as .github/workflows/claude.yml on the default branch.
#
# Only people with write access to the repo can trigger it (the action checks). Issues opened
# by the console use GITHUB_CONTENT_TOKEN, which must therefore be the owner's own fine-grained
# personal access token (not a bot/app token — bots are ignored by default).
#
# Inputs checked against anthropics/claude-code-action@v1's action.yml and docs (2026-09):
# claude_code_oauth_token, trigger_phrase (default "@claude"), claude_args. By default the action
# only pushes a branch and posts a "Create PR" link; `gh pr create` is allowed below so Claude
# opens the PR itself (the action exports GH_TOKEN for it).

name: Claude

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # the action exchanges an OIDC token for the Claude GitHub app's token
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(npm ci),Bash(npm install),Bash(npm run build),Bash(npm run lint),Bash(npx tsc:*),Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*)"
            --append-system-prompt "You are working on a live client website. Never push to the repository's default branch. Commit to your own claude/ branch, run the build, then open a pull request against the default branch with gh pr create (use --draft if anything is uncertain) and put 'Closes #<issue number>' in the PR body. Keep changes minimal and focused on the request. If the request is ambiguous, ask in an issue comment instead of guessing."
