# Chronicling America bulk OCR (whole batches of New Mexico newspaper text).
# discover: list the Library of Congress dataset portal's shape and the New Mexico batches.
name: bulk

on:
  workflow_dispatch:
    inputs:
      command:
        description: "discover | batches | fars-inspect | peek-fra | peek-msha | public-dry | peek-news"
        required: true
        default: discover

jobs:
  bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Run
        run: |
          if [ "${{ inputs.command }}" = "peek-fra" ] || [ "${{ inputs.command }}" = "peek-msha" ] || [ "${{ inputs.command }}" = "peek-news" ]; then
            c="${{ inputs.command }}"; NOTICE_ON_SUCCESS=1 .github/scripts/run.sh "$c" python -m pipeline.sources.peek "${c#peek-}"
          elif [ "${{ inputs.command }}" = "public-dry" ]; then
            NOTICE_ON_SUCCESS=1 .github/scripts/run.sh public-dry python -m pipeline.public_deaths all --dry-run
          elif [ "${{ inputs.command }}" = "fars-inspect" ]; then
            for y in 2001 2005 2007; do NOTICE_ON_SUCCESS=1 .github/scripts/run.sh fars-inspect-$y python -m pipeline.fars inspect $y; done
          else
            NOTICE_ON_SUCCESS=1 .github/scripts/run.sh bulk python -m pipeline.sources.bulk_ocr ${{ inputs.command }}
          fi
