# Data pipeline schedule (times are UTC; New Mexico is UTC-6 in summer, UTC-7 in winter).
# Runs on GitHub Actions instead of Vercel Cron: Python-native, no function timeouts.
name: pipeline

on:
  schedule:
    - cron: "7 12 * * *"   # daily ~6am MT: RSS harvest → geocode → historic suggestions
    - cron: "37 8 * * *"   # nightly ~2am MT: dedupe → translate → parcel match
    - cron: "17 */3 * * *" # every 3h: collect finished Message Batches
  workflow_dispatch:
    inputs:
      job:
        description: "harvest | nightly | batches | parcels"
        required: true
        default: nightly

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AP_MAX_RUN_COST_USD: "5"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: Database connected?
        id: db
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "Database not connected yet (baas connect-tenant-site); skipping."; echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - name: Daily harvest
        if: steps.db.outputs.ok == 'true' && (github.event.schedule == '7 12 * * *' || inputs.job == 'harvest')
        run: |
          python -m pipeline.harvest --rss --max-cost 1
          python -m pipeline.geocode
          python -m pipeline.historic_geo --limit 100

      - name: Nightly dedupe
        if: steps.db.outputs.ok == 'true' && (github.event.schedule == '37 8 * * *' || inputs.job == 'nightly')
        run: |
          python -m pipeline.dedupe --limit 500
          python -m pipeline.translate --limit 500
          python -m pipeline.parcels match

      - name: Collect batches
        if: steps.db.outputs.ok == 'true' && (github.event.schedule == '17 */3 * * *' || inputs.job == 'batches')
        run: python -m pipeline.batches poll

      - name: Load Bernalillo parcels (by hand)
        if: steps.db.outputs.ok == 'true' && inputs.job == 'parcels'
        run: |
          python -m pipeline.parcels fetch bernalillo
          python -m pipeline.parcels match
