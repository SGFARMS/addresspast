# Data pipeline schedule (times are UTC; New Mexico is UTC-6 in summer, UTC-7 in winter).
# Runs on GitHub Actions instead of Vercel Cron: Python-native, no function timeouts.
# Scheduled runs write to the live site, so they only run while pipeline/LIVE_ON exists (added once
# Joe has spot-checked the first records). "Run workflow" by hand always works.
# Scheduled runs are also gated at the job level by the repo variable PIPELINE_LIVE: set it to "false"
# (Settings → Secrets and variables → Actions → Variables) and scheduled runs are skipped before a
# runner starts (0 billed Actions minutes). Unset or anything else = on. Manual runs are never gated.
name: pipeline

on:
  schedule:
    - cron: "7 12 * * *"   # daily ~6am MT: RSS harvest → geocode → historic suggestions
    - cron: "37 8 * * *"   # nightly ~2am MT: dedupe → translate → parcel match
    - cron: "17 */3 * * *" # every 3h: collect finished Message Batches
  workflow_dispatch:
    inputs:
      job:
        description: "harvest | nightly | batches | parcels | publish (release spot-check holds, re-place, then nightly) | stats (counts only) | fars-inspect | fars (load NHTSA fatal crashes) | public-deaths (FRA crossings, MSHA mines, NTSB air crashes, NOAA weather) | dedupe-sweep (merge duplicates already on the map) | fars-old (NHTSA crashes 1975-2000, town level) | quality (list records that aren't deaths) | quality-apply (hide them)"
        required: true
        default: nightly

concurrency:
  # One AddressPast database job at a time: the shared BaaS server has 1 GB of RAM (it ran out on Oct 26).
  # The 3-hourly batch check is tiny and gets its own lane: in the shared one, its pending run replaced
  # (cancelled) a manual job waiting there (Oct 27).
  group: ${{ github.event.schedule == '17 */3 * * *' && 'addresspast-batches' || 'addresspast-db' }}
  cancel-in-progress: false

jobs:
  run:
    # Job-level gate: skipped scheduled runs never start a runner (0 billed minutes).
    if: github.event_name != 'schedule' || vars.PIPELINE_LIVE != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AP_MAX_RUN_COST_USD: "5"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: Database connected?
        id: db
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "::notice::Database not connected yet (baas connect-tenant-site); skipping."; echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ ! -f pipeline/LIVE_ON ]; then echo "Scheduled live runs are off until pipeline/LIVE_ON exists (after the spot-check); skipping."; echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - name: Daily harvest
        if: steps.db.outputs.ok == 'true' && (github.event.schedule == '7 12 * * *' || inputs.job == 'harvest')
        run: |
          set -e
          .github/scripts/run.sh rss-harvest python -m pipeline.harvest --rss --max-cost 1
          .github/scripts/run.sh geocode python -m pipeline.geocode --max-minutes 20
          .github/scripts/run.sh historic-geo python -m pipeline.historic_geo --limit 100

      - name: Release spot-check holds and re-place records
        if: steps.db.outputs.ok == 'true' && inputs.job == 'publish'
        run: |
          set -e
          NOTICE_ON_SUCCESS=1 .github/scripts/run.sh release python -m pipeline.release
          NOTICE_ON_SUCCESS=1 .github/scripts/run.sh geocode-retry python -m pipeline.geocode --recheck-towns --max-minutes 20

      - name: Nightly dedupe
        if: steps.db.outputs.ok == 'true' && (github.event.schedule == '37 8 * * *' || inputs.job == 'nightly' || inputs.job == 'publish')
        run: |
          set -e
          NOTICE_ON_SUCCESS=1 .github/scripts/run.sh dedupe python -m pipeline.dedupe --limit 500 --max-minutes 30
          # --weekly: one pass a week at most, none once a pass finds no duplicates (pipeline/sweep_policy.py)
          NOTICE_ON_SUCCESS=1 .github/scripts/run.sh dedupe-sweep python -m pipeline.dedupe --sweep --weekly --max-minutes 30
          .github/scripts/run.sh translate python -m pipeline.translate --limit 500
          .github/scripts/run.sh parcel-match python -m pipeline.parcels match

      - name: Collect batches
        if: steps.db.outputs.ok == 'true' && (github.event.schedule == '17 */3 * * *' || inputs.job == 'batches')
        run: .github/scripts/run.sh batches python -m pipeline.batches poll

      - name: FARS (look at the file layout)
        if: inputs.job == 'fars-inspect'
        run: |
          for y in 2001 2005 2007; do NOTICE_ON_SUCCESS=1 .github/scripts/run.sh fars-inspect-$y python -m pipeline.fars inspect $y; done

      - name: FARS fatal crashes (load, then publish)
        if: steps.db.outputs.ok == 'true' && inputs.job == 'fars'
        run: |
          set -e
          NOTICE_ON_SUCCESS=1 .github/scripts/run.sh fars python -m pipeline.fars load --from 2000 --to 2024
          NOTICE_ON_SUCCESS=1 .github/scripts/run.sh publish python -m pipeline.dedupe --limit 100 --max-minutes 45

      - name: Records that are not a death (list, or hide with quality-apply)
        if: steps.db.outputs.ok == 'true' && (inputs.job == 'quality' || inputs.job == 'quality-apply')
        run: NOTICE_ON_SUCCESS=1 .github/scripts/run.sh quality python -m pipeline.quality ${{ inputs.job == 'quality-apply' && '--apply' || '' }}

      - name: FARS 1975-2000 (town level, then place and publish)
        if: steps.db.outputs.ok == 'true' && inputs.job == 'fars-old'
        run: |
          set -e
          NOTICE_ON_SUCCESS=1 .github/scripts/run.sh fars-old python -m pipeline.fars load-old --from 1975 --to 2000
          NOTICE_ON_SUCCESS=1 .github/scripts/run.sh geocode python -m pipeline.geocode --max-minutes 30
          NOTICE_ON_SUCCESS=1 .github/scripts/run.sh publish python -m pipeline.dedupe --limit 100 --max-minutes 40

      - name: Merge duplicates already on the map
        if: steps.db.outputs.ok == 'true' && inputs.job == 'dedupe-sweep'
        run: |
          NOTICE_ON_SUCCESS=1 .github/scripts/run.sh quality python -m pipeline.quality --apply || true
          NOTICE_ON_SUCCESS=1 .github/scripts/run.sh dedupe-sweep python -m pipeline.dedupe --sweep --max-minutes 100

      - name: Railroad, mine, air-crash and weather deaths (load, then publish)
        if: steps.db.outputs.ok == 'true' && inputs.job == 'public-deaths'
        run: |
          set -e
          sudo apt-get install -y -qq mdbtools >/dev/null
          NOTICE_ON_SUCCESS=1 .github/scripts/run.sh public-deaths python -m pipeline.public_deaths all
          NOTICE_ON_SUCCESS=1 .github/scripts/run.sh geocode python -m pipeline.geocode --max-minutes 15
          NOTICE_ON_SUCCESS=1 .github/scripts/run.sh publish python -m pipeline.dedupe --limit 300 --max-minutes 30

      - name: Record counts
        if: steps.db.outputs.ok == 'true' && (inputs.job == 'stats' || inputs.job == 'publish' || inputs.job == 'fars' || inputs.job == 'public-deaths' || inputs.job == 'dedupe-sweep' || inputs.job == 'fars-old')
        run: NOTICE_ON_SUCCESS=1 .github/scripts/run.sh counts python -m pipeline.stats

      - name: Load Bernalillo parcels (by hand)
        if: steps.db.outputs.ok == 'true' && inputs.job == 'parcels'
        run: |
          set -e
          .github/scripts/run.sh parcels-fetch python -m pipeline.parcels fetch bernalillo
          .github/scripts/run.sh parcel-match python -m pipeline.parcels match
