# Data pipeline schedule (times are UTC; New Mexico is UTC-6 in summer, UTC-7 in winter).
# Runs on GitHub Actions instead of Vercel Cron: Python-native, no function timeouts.
# Scheduled runs write to the live site, so they only run while pipeline/LIVE_ON exists (added once
# Joe has spot-checked the first records). "Run workflow" by hand always works.
# Scheduled runs are also gated at the job level by the repo variable PIPELINE_LIVE: until it is
# "true" (Settings → Secrets and variables → Actions → Variables), a scheduled run is skipped
# before a runner starts, so switched-off runs bill 0 Actions minutes. Going live = add
# pipeline/LIVE_ON *and* set PIPELINE_LIVE to true. Manual runs are never gated by the variable.
name: pipeline

on:
  schedule:
    - cron: "7 12 * * *"   # daily ~6am MT: RSS harvest → geocode → historic suggestions
    - cron: "37 8 * * *"   # nightly ~2am MT: dedupe → translate → parcel match
    - cron: "17 */3 * * *" # every 3h: collect finished Message Batches
  workflow_dispatch:
    inputs:
      job:
        description: "harvest | nightly | batches | parcels"
        required: true
        default: nightly

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    # Job-level gate: skipped scheduled runs never start a runner (0 billed minutes).
    if: github.event_name != 'schedule' || vars.PIPELINE_LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AP_MAX_RUN_COST_USD: "5"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: Database connected?
        id: db
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "::notice::Database not connected yet (baas connect-tenant-site); skipping."; echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ ! -f pipeline/LIVE_ON ]; then echo "Scheduled live runs are off until pipeline/LIVE_ON exists (after the spot-check); skipping."; echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - name: Daily harvest
        if: steps.db.outputs.ok == 'true' && (github.event.schedule == '7 12 * * *' || inputs.job == 'harvest')
        run: |
          set -e
          .github/scripts/run.sh rss-harvest python -m pipeline.harvest --rss --max-cost 1
          .github/scripts/run.sh geocode python -m pipeline.geocode
          .github/scripts/run.sh historic-geo python -m pipeline.historic_geo --limit 100

      - name: Nightly dedupe
        if: steps.db.outputs.ok == 'true' && (github.event.schedule == '37 8 * * *' || inputs.job == 'nightly')
        run: |
          set -e
          .github/scripts/run.sh dedupe python -m pipeline.dedupe --limit 500
          .github/scripts/run.sh translate python -m pipeline.translate --limit 500
          .github/scripts/run.sh parcel-match python -m pipeline.parcels match

      - name: Collect batches
        if: steps.db.outputs.ok == 'true' && (github.event.schedule == '17 */3 * * *' || inputs.job == 'batches')
        run: .github/scripts/run.sh batches python -m pipeline.batches poll

      - name: Load Bernalillo parcels (by hand)
        if: steps.db.outputs.ok == 'true' && inputs.job == 'parcels'
        run: |
          set -e
          .github/scripts/run.sh parcels-fetch python -m pipeline.parcels fetch bernalillo
          .github/scripts/run.sh parcel-match python -m pipeline.parcels match
