name: ci-pipeline

# Python pipeline tests, only when the pipeline changes.
on:
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/ci-pipeline.yml"]
  pull_request:
    paths: ["pipeline/**", ".github/workflows/ci-pipeline.yml"]

concurrency:
  group: ci-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest requests
      - run: .github/scripts/run.sh pytest python -m pytest pipeline/tests -q
