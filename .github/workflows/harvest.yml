# Run the newspaper harvester by hand (Actions → harvest → Run workflow).
# dry-run: no database. extract_limit 0 = just count candidates and estimate cost;
#          extract_limit 150 = also extract 150 candidates into records.csv for a spot-check.
# live:    writes to the BaaS tenant. Spend is capped across all runs by AP_HARVEST_CAP_USD ($20).
# Results: the run summary, plus the "harvest-out" artifact (records.csv, stats.json, ...).
# Backlog autopilot: while pipeline/BACKFILL_ON exists, a live bulk-OCR run starts every 6 hours and reads
# the New Mexico batches it hasn't finished yet (whole batches of newspaper text, no search API).
name: harvest

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "bulk (Chronicling America bulk OCR, fastest), loc (search API) or rss"
        required: true
        default: bulk
        type: choice
        options: [bulk, loc, rss]
      mode:
        description: "dry-run (no database) or live"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, live]
      start_year:
        description: "first year (loc)"
        default: "1880"
      end_year:
        description: "last year (loc)"
        default: "1963"
      start_page:
        description: "resume page inside start_year (from the last run's summary)"
        default: "1"
      extract_limit:
        description: "dry-run: how many candidates to send to Claude (0 = none)"
        default: "0"
      max_cost:
        description: "USD cap for this run"
        default: "20"
      scope:
        description: "loc: state (every NM paper) or local (papers printed in ABQ/Belen/Los Lunas/Bernalillo)"
        required: true
        default: state
        type: choice
        options: [state, local]
      max_pages:
        description: "stop after this many newspaper pages (0 = no limit)"
        default: "0"
      hold_for_review:
        description: "live: hold every new record in /admin until approved (spot-check)"
        required: true
        default: "no"
        type: choice
        options: ["yes", "no"]

concurrency:
  # One AddressPast database job at a time: the shared BaaS server has 1 GB of RAM (it ran out on Oct 26).
  group: addresspast-db
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AP_HARVEST_CAP_USD: "20"
      AP_HOLD_FOR_REVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.hold_for_review == 'yes' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: Settings
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ ! -f pipeline/BACKFILL_ON ]; then echo "Backlog autopilot is off (no pipeline/BACKFILL_ON)."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "mode=live" >> "$GITHUB_OUTPUT"
            echo "args=--bulk --start-year 1860 --end-year 1963 --max-cost 20" >> "$GITHUB_OUTPUT"
          else
            A="--${{ inputs.source }} --max-cost ${{ inputs.max_cost }}"
            if [ "${{ inputs.source }}" = "bulk" ]; then
              A="$A --start-year ${{ inputs.start_year }} --end-year ${{ inputs.end_year }} --max-pages ${{ inputs.max_pages }}"
            fi
            if [ "${{ inputs.source }}" = "loc" ]; then
              A="$A --start-year ${{ inputs.start_year }} --end-year ${{ inputs.end_year }} --max-pages ${{ inputs.max_pages }} --scope ${{ inputs.scope }}"
              if [ "${{ inputs.start_page }}" = "resume" ]; then A="$A --resume"; else A="$A --start-page ${{ inputs.start_page }}"; fi
            fi
            if [ "${{ inputs.mode }}" = "dry-run" ]; then A="$A --dry-run --extract-limit ${{ inputs.extract_limit }}"; fi
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "args=$A" >> "$GITHUB_OUTPUT"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check secrets
        if: steps.cfg.outputs.skip != 'true'
        run: |
          if [ "${{ steps.cfg.outputs.mode }}" = "live" ] && [ -z "$SUPABASE_URL" ]; then
            echo "::error::Live mode needs SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY (baas Droplet ops → connect-tenant-site)"; exit 1; fi
          if [ "${{ inputs.extract_limit || '0' }}" != "0" ] || [ "${{ steps.cfg.outputs.mode }}" = "live" ]; then
            if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::error::Add the ANTHROPIC_API_KEY repo secret"; exit 1; fi; fi

      - name: Harvest
        if: steps.cfg.outputs.skip != 'true'
        # Stops cleanly before the job's 345-minute timeout so the summary and files are always written.
        run: NOTICE_ON_SUCCESS=1 .github/scripts/run.sh harvest python -m pipeline.harvest ${{ steps.cfg.outputs.args }} --max-minutes 200 --out harvest-out

      - name: Geocode new records
        if: always() && steps.cfg.outputs.skip != 'true' && steps.cfg.outputs.mode == 'live'
        run: |
          NOTICE_ON_SUCCESS=1 .github/scripts/run.sh geocode python -m pipeline.geocode --max-minutes 45
          # Records no town was found for before the USGS place names (ghost towns) went in
          NOTICE_ON_SUCCESS=1 .github/scripts/run.sh geocode-retry python -m pipeline.geocode --retry-failed --max-minutes 20

      - name: Publish new records
        # Put this run's finds on the map now instead of waiting for the nightly job.
        if: always() && steps.cfg.outputs.skip != 'true' && steps.cfg.outputs.mode == 'live'
        run: |
          set -e
          NOTICE_ON_SUCCESS=1 .github/scripts/run.sh publish python -m pipeline.dedupe --limit 4000 --max-minutes 60
          NOTICE_ON_SUCCESS=1 .github/scripts/run.sh counts python -m pipeline.stats

      - uses: actions/upload-artifact@v5
        # Dry runs only: a live run's records go to the database, and artifacts on a public repo can be
        # downloaded by anyone signed in to GitHub.
        if: always() && steps.cfg.outputs.skip != 'true' && steps.cfg.outputs.mode != 'live'
        with:
          name: harvest-out
          path: harvest-out/
          retention-days: 30
