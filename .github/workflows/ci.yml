name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# A newer push to the same branch or PR cancels the older, now-obsolete run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: .github/scripts/run.sh install npm install --no-audit --no-fund
      - run: .github/scripts/run.sh typecheck npm run typecheck
      - run: .github/scripts/run.sh lint npm run lint
      - run: .github/scripts/run.sh unit npm test
      - run: .github/scripts/run.sh build npm run build
      - run: npx playwright install --with-deps chromium
      - run: .github/scripts/run.sh e2e npm run e2e

  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest requests
      - run: .github/scripts/run.sh pytest python -m pytest pipeline/tests -q
