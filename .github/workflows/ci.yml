name: ci

# Site checks. Changes that only touch the Python pipeline or workflows skip this (saves Actions minutes);
# those are tested by ci-pipeline.yml.
on:
  push:
    branches: [main]
    paths-ignore: ["pipeline/**", ".github/workflows/harvest.yml", ".github/workflows/pipeline.yml", ".github/workflows/bulk.yml", "*.md"]
  pull_request:
    paths-ignore: ["pipeline/**", ".github/workflows/harvest.yml", ".github/workflows/pipeline.yml", ".github/workflows/bulk.yml", "*.md"]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: .github/scripts/run.sh install npm install --no-audit --no-fund
      - run: .github/scripts/run.sh typecheck npm run typecheck
      - run: .github/scripts/run.sh lint npm run lint
      - run: .github/scripts/run.sh unit npm test
      - run: .github/scripts/run.sh build npm run build
      - run: npx playwright install --with-deps chromium
      - run: .github/scripts/run.sh e2e npm run e2e
